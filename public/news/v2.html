<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kray EC Intelligence 시스템</title><style>
:root{--bg:#f6f8fc;--card:#fff;--text:#111827;--muted:#667085;--line:#e4e7ec;--soft:#f8fafc;--good:#12a66a;--bad:#e5484d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 24px}.top{display:flex;justify-content:space-between;align-items:flex-start}.logo{height:40px}.status{text-align:right;font-size:12px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#98a2b3;margin-right:5px}.dot.ok{background:#12b76a}.dot.err{background:#f04438}.updated{margin-top:8px}.hero{margin:22px 0 18px}.title{font-size:34px;font-weight:900;letter-spacing:-.045em}.subtitle{margin-top:8px;color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.kpi,.section{background:#fff;border:1px solid var(--line);box-shadow:0 2px 10px rgba(16,24,40,.03)}.kpi{border-radius:17px;padding:17px}.kpi span{font-size:12px;color:var(--muted)}.kpi b{display:block;font-size:26px;margin-top:7px}.section{border-radius:18px;padding:17px;margin-bottom:14px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.sectionhead h2,.section>h2{font-size:18px;margin:0;white-space:nowrap}.small{font-size:11px;color:var(--muted)}.newsrow{padding:12px 0;border-top:1px solid var(--line)}.newsrow:first-child{border:0}.newstitle{font-weight:800}.newssummary{font-size:13px;color:var(--muted);margin-top:5px}.trend{margin-top:12px;background:var(--soft);border-radius:12px;padding:12px}.signals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.signal{border:1px solid var(--line);border-radius:13px;padding:13px}.signal b{display:block;margin:5px 0}.signal p{margin:0;color:var(--muted);font-size:12px}.execgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden}.execcard{display:grid;grid-template-columns:1fr 68px;gap:7px;align-items:end;min-width:0;padding:13px 11px;border-right:1px solid var(--line)}.execcard:last-child{border:0}.execmeta{min-width:0}.execcat{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.execname{font-size:13px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.execrank{font-size:25px;font-weight:900;margin-top:8px}.execdelta{font-size:11px}.execthumb{width:58px;height:58px;object-fit:contain;justify-self:end}.chartbox{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff}.overview{width:100%;height:315px}.legend{display:flex;justify-content:space-around;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px}.legenditem{display:flex;align-items:center;gap:6px}.legendthumb{width:42px;height:42px;border-radius:9px;object-fit:contain;background:var(--soft)}.legenddot{width:15px;height:3px}.watchgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.product{border:1px solid var(--line);border-radius:15px;padding:11px;min-width:0}.producttop{display:flex;justify-content:space-between;gap:5px}.categorypill{font-size:10px;background:#f2f4f7;border-radius:999px;padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.range{display:flex;gap:2px}.range button{border:0;background:#f2f4f7;border-radius:6px;padding:4px 5px;font-size:9px}.range button.active{background:#dfe6ef;font-weight:700}.prodthumb{width:82px;height:82px;display:block;object-fit:contain;margin:8px auto}.prodname{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prodrank{display:flex;justify-content:space-between;align-items:baseline}.rank{font-size:24px;font-weight:900}.delta{font-size:11px;font-weight:700}.spark{width:100%;height:90px}.insight{border-radius:8px;padding:7px;font-size:10px;text-align:center;background:#f6fef9;color:#067647}.insight.bad{background:#fff1f3;color:#c01048}.mutednote{text-align:center;font-size:9px;color:var(--muted);margin-top:7px}.placeholder{display:flex;align-items:center;justify-content:center;color:#98a2b3;background:var(--soft)}.empty{font-size:13px;color:var(--muted);padding:14px}.error{background:#fef3f2;color:#b42318;padding:12px}.up{color:var(--good)}.down{color:var(--bad)}@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.signals{grid-template-columns:1fr}.execgrid{grid-template-columns:repeat(2,1fr)}.watchgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.wrap{padding:16px 14px}.title{font-size:27px}.kpis{grid-template-columns:1fr 1fr}.execgrid,.watchgrid{grid-template-columns:1fr}.execcard{border-right:0;border-bottom:1px solid var(--line)}.overview{height:255px}}
</style></head><body><div class="wrap"><header class="top"><img class="logo" src="/kray_logo.png"><div class="status"><div><span id="dot" class="dot"></span><span id="statusText">데이터 불러오는 중</span></div><div id="updated" class="updated"></div></div></header><section class="hero"><div class="title">Kray EC Intelligence 시스템</div><div class="subtitle">AI·테크 뉴스와 Rakuten 상품 랭킹 데이터를 연결해, 매일의 변화와 실행 신호를 한눈에 확인합니다.</div></section><div class="kpis"><div class="kpi"><span>오늘의 AI 핵심 뉴스</span><b id="newsCount">-</b></div><div class="kpi"><span>모니터링 상품</span><b id="watchCount">-</b></div><div class="kpi"><span>전일 대비 상승 상품</span><b id="risingCount">-</b></div><div class="kpi"><span>평균 현재 랭킹</span><b id="avgRank">-</b></div></div><section class="section"><h2>🤖 오늘의 AI & Tech</h2><div id="aiNews"><div class="empty">데이터 연결 중입니다.</div></div><div id="trend"></div></section><section class="section"><div class="sectionhead"><h2>🎯 오늘의 전략 신호</h2></div><div id="signals" class="signals"></div></section><section class="section"><div class="sectionhead"><h2>📌 Executive Summary</h2></div><div id="execGrid" class="execgrid"></div></section><section class="section"><div class="sectionhead"><h2>📊 Ranking Trend</h2></div><div class="chartbox"><svg id="overview" class="overview" viewBox="0 0 1080 315"></svg><div id="legend" class="legend"></div></div></section><section class="section"><div class="sectionhead"><h2>📈 Rakuten Watchlist Detail</h2></div><div id="watchGrid" class="watchgrid"></div></section></div><script>
(function(){var API='/api/news',C=['#2563eb','#16a34a','#9333ea','#f97316','#64748b'];function e(i){return document.getElementById(i)}function x(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function f(d){var p=String(d||'').split('-');return p.length===3?Number(p[1])+'/'+Number(p[2]):''}function rt(o){return o.rank==null?'—':o.rank+'위'}function dt(d){if(d==null)return'랭킹 미확인';d=Number(d);return(d>0?'▼ ':d<0?'▲ ':'→ ')+Math.abs(d)}function sg(o){var d=o.delta==null?null:Number(o.delta);if(d>0)return['up','전일 대비 '+d+' 상승'];if(d<0)return['down','전일 대비 '+Math.abs(d)+' 하락'];return['','변동 없음']}function is(u){return!u?'':u.indexOf('/api/')===0?u:'/api/rakuten-image?url='+encodeURIComponent(u)}function im(u,c){var s=is(u);return s?'<img class="'+c+'" src="'+x(s)+'" loading="lazy">':'<div class="'+c+' placeholder">NO IMAGE</div>'}function pk(o,n){if(n===365)return[o.history365||o.history30||[],o.history365Dates||o.history30Dates||[]];if(n===90)return[o.history90||o.history30||[],o.history90Dates||o.history30Dates||[]];if(n===30)return[o.history30||[],o.history30Dates||[]];return[o.history7||[],o.history7Dates||[]]}
function sp(svg,v,col){var a=[];for(var i=0;i<v.length;i++)if(v[i]!=null&&!isNaN(+v[i]))a.push({i:i,v:+v[i]});svg.setAttribute('viewBox','0 0 230 90');if(a.length<2){svg.innerHTML='<line x1="10" y1="50" x2="220" y2="50" stroke="#98a2b3" stroke-width="2"/>';return}var mn=Math.min.apply(null,a.map(function(q){return q.v})),mx=Math.max.apply(null,a.map(function(q){return q.v})),z=Math.max(1,mx-mn);svg.innerHTML='<polyline fill="none" stroke="'+col+'" stroke-width="2.4" points="'+a.map(function(q){return(10+q.i*210/Math.max(1,v.length-1))+','+(10+(q.v-mn)*58/z)}).join(' ')+'"/>'}
function render(d){var a=d.aiNews||{},w=d.watchlist||[],rs=w.filter(function(o){return o.rank!=null}).map(function(o){return+o.rank});e('newsCount').textContent=(a.news||[]).length;e('watchCount').textContent=w.length;e('risingCount').textContent=w.filter(function(o){return+o.delta>0}).length;e('avgRank').textContent=rs.length?Math.round(rs.reduce(function(a,b){return a+b},0)/rs.length):'-';e('aiNews').innerHTML=(a.news||[]).map(function(n,i){return'<div class="newsrow"><div class="newstitle">'+(i+1)+'. '+x(n.title)+'</div><div class="newssummary">'+x(n.summary)+'</div></div>'}).join('')||'<div class="empty">오늘 뉴스가 없습니다.</div>';e('trend').innerHTML=a.trend?'<div class="trend"><b>💡 오늘의 핵심 흐름</b><div>'+x(a.trend)+'</div></div>':'';var best=w.filter(function(o){return o.rank!=null}).sort(function(a,b){return a.rank-b.rank})[0],rise=w.filter(function(o){return+o.delta>0}).sort(function(a,b){return b.delta-a.delta})[0],fall=w.filter(function(o){return+o.delta<0}).sort(function(a,b){return a.delta-b.delta})[0],sa=[];if(rise)sa.push(['상승 모멘텀',rise.label,rise.rank+'위']);if(fall)sa.push(['리스크 체크',fall.label,fall.rank+'위']);if(best)sa.push(['현재 최고 성과',best.label,best.rank+'위']);e('signals').innerHTML=sa.map(function(q){return'<div class="signal"><span class="small">'+q[0]+'</span><b>'+x(q[1])+'</b><p>'+q[2]+'</p></div>'}).join('');e('execGrid').innerHTML=w.map(function(o){var s=sg(o);return'<div class="execcard"><div class="execmeta"><div class="execcat">'+x(o.category||'카테고리 미확인')+'</div><div class="execname" title="'+x(o.label)+'">'+x(o.label)+'</div><div class="execrank">'+rt(o)+'</div><div class="execdelta '+s[0]+'">'+dt(o.delta)+'</div></div>'+im(o.imageUrl,'execthumb')+'</div>'}).join('');var dates=[];w.forEach(function(o){(o.history365Dates||o.history30Dates||[]).forEach(function(d){if(dates.indexOf(d)<0)dates.push(d)})});dates.sort();var vals=[];w.forEach(function(o){(o.history365||o.history30||[]).forEach(function(v){if(v!=null&&!isNaN(+v))vals.push(+v)})});var sv=e('overview'),h='';if(dates.length>1&&vals.length){var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),z=Math.max(1,mx-mn);for(var g=0;g<5;g++){var y=20+g*62;h+='<line x1="48" y1="'+y+'" x2="1060" y2="'+y+'" stroke="#eef0f3"/>'}w.forEach(function(o,k){var ds=o.history365Dates||o.history30Dates||[],vs=o.history365||o.history30||[],p=[];dates.forEach(function(d,i){var j=ds.indexOf(d);if(j>=0&&vs[j]!=null)p.push((48+i*1012/Math.max(1,dates.length-1))+','+(20+(+vs[j]-mn)*248/z))});if(p.length)h+='<polyline fill="none" stroke="'+C[k%C.length]+'" stroke-width="2.5" points="'+p.join(' ')+'"/>'});dates.forEach(function(d,i){if(i===0||i===dates.length-1||i%Math.max(1,Math.floor(dates.length/6))===0)h+='<text x="'+(48+i*1012/Math.max(1,dates.length-1))+'" y="300" text-anchor="middle" font-size="10" fill="#667085">'+f(d)+'</text>'});sv.innerHTML=h}else sv.innerHTML='<text x="540" y="158" text-anchor="middle" fill="#667085">데이터가 더 쌓이면 전체 추이가 표시됩니다.</text>';e('legend').innerHTML=w.map(function(o,i){return'<div class="legenditem">'+im(o.imageUrl,'legendthumb')+'<span class="legenddot" style="background:'+C[i%C.length]+'"></span></div>'}).join('');e('watchGrid').innerHTML=w.map(function(o,i){var s=sg(o);return'<article class="product"><div class="producttop"><span class="categorypill">'+x(o.category||'기타')+'</span><div class="range"><button class="active" data-r="7">7일</button><button data-r="30">30일</button><button data-r="90">90일</button><button data-r="365">1년</button></div></div>'+im(o.imageUrl,'prodthumb')+'<div class="prodname" title="'+x(o.label)+'">'+x(o.label)+'</div><div class="prodrank"><span class="rank">'+rt(o)+'</span><span class="delta '+s[0]+'">'+dt(o.delta)+'</span></div><svg class="spark"></svg><div class="insight '+(s[0]==='down'?'bad':'')+'">'+x(s[1])+'</div><div class="mutednote">최근 업데이트 · '+f((o.history7Dates||[]).slice(-1)[0])+'</div></article>'}).join('');document.querySelectorAll('.product').forEach(function(card,i){var o=w[i],p=pk(o,7);sp(card.querySelector('.spark'),p[0],C[i%C.length]);card.querySelectorAll('button').forEach(function(b){b.onclick=function(){card.querySelectorAll('button').forEach(function(q){q.classList.remove('active')});b.classList.add('active');var q=pk(o,+b.dataset.r);sp(card.querySelector('.spark'),q[0],C[i%C.length])}})});e('dot').className='dot ok';e('statusText').textContent='데이터 연결 정상';e('updated').textContent='↻ '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tokyo'})+' 업데이트'}fetch(API+'?_='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(render).catch(function(q){e('dot').className='dot err';e('statusText').textContent='데이터 연결 오류';e('aiNews').innerHTML='<div class="error">'+x(q.message)+'</div>'})})();
</script></body></html>
