<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KRAY AI NEWS</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--good:#067647;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.title{font-size:28px;font-weight:800}.sub,.meta{color:var(--muted)}.sub{margin-top:6px}.pill{background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.metric,.section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.metric b{font-size:24px}.metric span{display:block;color:var(--muted);font-size:13px;margin-top:6px}.layout{display:grid;grid-template-columns:1.55fr 1fr;gap:16px}.section{margin-bottom:16px}.section h2{font-size:17px;margin:0 0 14px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.name{font-weight:700}.meta{font-size:13px;margin-top:4px}.rank{font-weight:800;white-space:nowrap}.up{color:var(--good)}.down{color:var(--bad)}.brief{white-space:pre-line;background:#111827;color:#fff;border-radius:16px;padding:16px;font-size:14px;line-height:1.65}.empty{color:var(--muted);padding:10px 0}@media(max-width:850px){.grid{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.top{flex-direction:column}.wrap{padding:14px}}
</style>
</head><body><div class="wrap">
<div class="top"><div><div class="title">KRAY AI NEWS</div><div class="sub">AI 뉴스 · 라쿠텐 셀러 신호 통합 대시보드</div></div><div class="pill" id="today"></div></div>
<div class="grid"><div class="metric"><b id="newsCount">-</b><span>오늘의 AI 핵심 뉴스</span></div><div class="metric"><b id="watchCount">-</b><span>라쿠텐 추적 상품</span></div><div class="metric"><b class="up" id="risingCount">-</b><span>랭킹 상승 상품</span></div></div>
<div class="layout"><main><section class="section"><h2>🔥 Rising Items</h2><div id="rising"><div class="empty">데이터 연결 대기 중</div></div></section><section class="section"><h2>🤖 AI & Tech Top 5</h2><div id="aiNews"><div class="empty">데이터 연결 대기 중</div></div></section></main><aside><section class="section"><h2>📩 Daily LINE Briefing</h2><div class="brief" id="brief">데이터 연결 대기 중</div></section></aside></div></div>
<script>
const API_BASE=''; // GAS Web App /exec URL 입력 후 자동 실데이터 연결
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateLabel=()=>new Intl.DateTimeFormat('ko-KR',{dateStyle:'full',timeZone:'Asia/Tokyo'}).format(new Date());document.getElementById('today').textContent=dateLabel();
function render(data){const ai=data.aiNews||{};const news=Array.isArray(ai.news)?ai.news:[];const watch=Array.isArray(data.watchlist)?data.watchlist:[];const rising=watch.filter(x=>Number(x.delta)>0).sort((a,b)=>Number(b.delta)-Number(a.delta));document.getElementById('newsCount').textContent=news.length;document.getElementById('watchCount').textContent=watch.length;document.getElementById('risingCount').textContent=rising.length;document.getElementById('aiNews').innerHTML=news.length?news.map((x,i)=>`<div class="row"><div><div class="name">${i+1}. ${esc(x.title)}</div><div class="meta">${esc(x.summary)}</div></div></div>`).join(''):'<div class="empty">오늘의 AI 뉴스가 없습니다.</div>';document.getElementById('rising').innerHTML=rising.length?rising.slice(0,10).map(x=>`<div class="row"><div><div class="name">${esc(x.label||x.itemCode)}</div><div class="meta">전일 대비 ${Number(x.delta)}계단 상승</div></div><div class="rank up">${x.rank?esc(x.rank)+'위':'1000위 밖'} ↑${Number(x.delta)}</div></div>`).join(''):'<div class="empty">오늘 상승 감지 상품이 없습니다.</div>';const lines=['☀️ KRAY AI NEWS','',...news.flatMap((x,i)=>[`${i+1}. ${x.title}`,x.summary,'']),ai.trend?'💡 오늘의 핵심 흐름\n'+ai.trend:'','', '🎯 RAKUTEN WATCHLIST','',...watch.map((x,i)=>`${i+1}. ${x.label||x.itemCode}\n현재 ${x.rank?x.rank+'위':'1000위 밖'}${x.prevRank?' / 전일 '+x.prevRank+'위':''}`)];document.getElementById('brief').textContent=lines.filter((x,i,a)=>!(x===''&&a[i-1]==='')).join('\n').trim();}
async function load(){if(!API_BASE){document.getElementById('brief').textContent='GAS Web App URL 연결 대기 중';return;}try{const r=await fetch(API_BASE+'?action=dashboard',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);render(await r.json());}catch(e){document.getElementById('brief').textContent='데이터를 불러오지 못했습니다.\n'+e.message;}}
load();
</script></body></html>
