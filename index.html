<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kray, Inc. | Renewal Draft v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Serif+JP:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15151A;
  --rice:#F7F6F1;
  --shu:#C8402F;
  --gold:#D4A420;
  --gray:#8A8A93;
  --gray-dk:#55555E;
  --line:rgba(21,21,26,.1);
  --line-lt:rgba(247,246,241,.12);
  --serif:'Noto Serif KR','Noto Serif JP','Georgia',serif;
  --sans:'Noto Sans KR','Noto Sans JP',-apple-system,'Helvetica Neue',sans-serif;
  --mono:'IBM Plex Mono','Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--rice);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}
img,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
::selection{background:var(--shu);color:#fff}

.wrap{max-width:1240px;margin:0 auto;padding:0 5vw}
.eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;
  color:var(--shu);display:flex;align-items:center;gap:.75em;margin-bottom:1.2rem}
.eyebrow::before{content:"";width:1.8em;height:1px;background:var(--shu);flex-shrink:0}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .9s ease,transform .9s ease}
.reveal.on{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}

/* ── NAV ── */
nav{position:fixed;inset:0 0 auto;z-index:100;display:flex;align-items:center;justify-content:space-between;
  padding:1rem 5vw;color:var(--rice);transition:background .4s,color .4s,box-shadow .4s,padding .3s}
@media(max-width:760px){
  nav{padding:.5rem 4vw}
  .nav-logo img{height:1.3rem}
  .nav-logo{font-size:.9rem}
}
nav.scrolled{background:rgba(247,246,241,.95);backdrop-filter:blur(16px);color:var(--ink);box-shadow:0 1px 0 var(--line);padding:.35rem 5vw;transition:padding .3s}
nav.scrolled .lang button{font-size:.65rem;padding:.28em .7em}
nav.scrolled .nav-cta{font-size:.65rem;padding:.28em .9em}
.nav-logo{font-family:var(--serif);font-weight:900;font-size:1.2rem;letter-spacing:.05em}
.nav-logo img{height:2.6rem;width:auto;object-fit:contain;filter:invert(1)}
nav.scrolled .nav-logo img{filter:none}
nav.scrolled .nav-logo img{height:1.6rem;transition:height .3s}
.nav-links{display:flex;gap:1.8rem;font-size:.8rem;font-weight:500;letter-spacing:.04em}
.nav-links a{opacity:.78;transition:opacity .2s}.nav-links a:hover{opacity:1}
.nav-right{display:flex;align-items:center;gap:.9rem}
.lang{display:flex;gap:.28rem;font-family:var(--mono);font-size:.68rem}
.lang button{background:none;border:1px solid currentColor;color:inherit;border-radius:99px;
  font-size:.74rem;padding:.35em .85em;line-height:1.4;cursor:pointer;opacity:.5;transition:all .2s,font-size .3s,padding .3s}
.lang button.active{opacity:1;background:var(--shu);border-color:var(--shu);color:#fff}
.nav-cta{background:var(--shu);color:#fff;font-size:.74rem;font-weight:600;
  padding:.35em 1.1em;line-height:1.4;border-radius:99px;letter-spacing:.04em;transition:background .2s,font-size .3s,padding .3s}
.nav-cta:hover{background:#a8321e}
@media(max-width:860px){.nav-links{display:none}}

/* ── HERO ── */
.hero{position:relative;height:100svh;min-height:640px;background:var(--ink);overflow:hidden;padding:0}
.hero-veil{position:absolute;inset:0;z-index:2;
  background:linear-gradient(to top,rgba(21,21,26,.88) 0%,rgba(21,21,26,.08) 48%,rgba(21,21,26,.4) 100%);pointer-events:none}
.hero-copy{position:absolute;left:5vw;bottom:10vh;z-index:5;color:var(--rice);max-width:680px;pointer-events:none}
.hero-copy .eyebrow{color:rgba(247,246,241,.7);margin-bottom:.9rem}
.hero-copy .eyebrow::before{background:var(--shu)}
.hero-copy h1{font-family:var(--serif);font-weight:900;font-size:clamp(2.4rem,5.2vw,4.2rem);line-height:1.18;margin-bottom:1rem}
.hero-copy h1 em{font-style:normal;color:var(--shu)}
.hero-copy p{font-size:clamp(.92rem,1.3vw,1.02rem);color:rgba(247,246,241,.78);font-weight:300;max-width:33em;line-height:1.8}
.tate{position:absolute;right:2.4vw;top:50%;transform:translateY(-50%);z-index:5;writing-mode:vertical-rl;
  font-family:var(--serif);font-size:.8rem;letter-spacing:.55em;color:rgba(247,246,241,.45);pointer-events:none}
.scroll-cue{position:absolute;left:50%;bottom:1.6rem;transform:translateX(-50%);z-index:5;
  color:rgba(247,246,241,.5);font-family:var(--mono);font-size:.68rem;letter-spacing:.32em;text-align:center}
.scroll-cue::after{content:"";display:block;width:1px;height:28px;background:rgba(247,246,241,.4);margin:.45rem auto 0;animation:drip 2.2s infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}55%{transform:scaleY(1);transform-origin:top}56%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* PC 3분할 */
.triptych{position:absolute;inset:0;display:flex;gap:2px;z-index:1}
.panel{position:relative;flex:1;overflow:hidden;transition:flex .85s cubic-bezier(.22,1,.36,1);min-width:0}
.panel video{width:100%;height:100%;object-fit:cover;filter:brightness(.58) saturate(1.05);transition:filter .6s}
.panel:hover{flex:1.7}.panel:hover video{filter:brightness(.82) saturate(1.1)}
.panel .p-label{position:absolute;left:1rem;bottom:1.1rem;font-family:var(--mono);font-size:.68rem;letter-spacing:.2em;
  color:rgba(247,246,241,.6);text-transform:uppercase;z-index:3}
/* 모바일 캐러셀 */
.carousel{display:none;position:absolute;inset:0;z-index:3}
.c-track{display:flex;height:100%;width:300%;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.c-slide{flex:0 0 33.333%;height:100%;overflow:hidden}
.c-slide video{width:100%;height:100%;object-fit:cover;filter:brightness(.62) saturate(1.05)}
/* scroll-cue: 모바일에서만 숨김 */
.c-dots{position:absolute;bottom:2.2rem;left:50%;transform:translateX(-50%);z-index:50;display:none;gap:.75rem;align-items:center;filter:drop-shadow(0 2px 12px rgba(0,0,0,.9))}
.c-dot{width:8px;height:8px;border-radius:50%;background:#fff;opacity:1;border:none;padding:0;cursor:pointer;flex-shrink:0;transition:width .35s cubic-bezier(.22,1,.36,1),border-radius .35s,background .35s}
.c-dot.on{background:#fff;width:24px;border-radius:4px}
.c-bar{position:absolute;bottom:0;left:0;height:2px;background:var(--shu);z-index:6;width:0;transition:width linear}
@media(max-width:760px){
  .triptych{display:none}.carousel{display:block}.tate{display:none}
  .scroll-cue{display:none}
  .c-dots{display:flex}
  .hero-copy{bottom:12vh;left:6vw;right:6vw;max-width:100%}
  .hero-copy h1{font-size:clamp(2rem,7.5vw,2.8rem)}
  .hero-copy p{font-size:.78rem}
  /* 모바일 여백 최적화 */
  .summary{padding:4rem 0 2rem}
  .influencer-section{padding:0 0 112px}
}

/* ── TICKER ── */
.ticker{background:var(--shu);overflow:hidden;padding:.75rem 0;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);position:relative;z-index:5}
.ticker-track{display:flex;gap:2.8rem;white-space:nowrap;font-family:var(--mono);font-size:.74rem;
  letter-spacing:.22em;text-transform:uppercase;color:var(--rice);animation:marquee 28s linear infinite;width:max-content;will-change:transform}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker-track i{font-style:normal;opacity:.45;margin:0 1.2rem}

/* ─────────────────────────────────────
   EXECUTIVE SUMMARY
───────────────────────────────────── */
.summary{padding:7rem 0 3rem;background:var(--rice)}

/* summary 제목 → 리뷰 카드 여백 */
#summary-title{margin-bottom:3rem}

/* 리뷰 카드 */
.episode-wrap{
  margin:0 0 2.8rem;
  padding:1.8rem 2.2rem 2rem;
  border-left:3px solid var(--shu);
  background:rgba(200,64,47,.03);
}
.review-stars{
  color:var(--gold);          /* 노란색 별 */
  font-size:1.1rem;
  letter-spacing:.12em;
  margin-bottom:1rem;
}
.episode-text{
  font-family:var(--serif);
  font-size:1.05rem;
  font-weight:400;
  line-height:1.85;
  color:var(--ink);
  font-style:italic;
  margin:0 0 1rem;
}
/* 번역본↔원문 구분선 */
.review-original{
  border-top:1px solid var(--line);
  padding-top:.9rem;
  margin-top:.9rem;
}
.review-original-label{
  font-family:var(--mono);
  font-size:.68rem;
  color:var(--gray);
  letter-spacing:.14em;
  display:block;
  margin-bottom:.45rem;
  text-transform:uppercase;
}
/* 원문은 연하게 */
.review-original-text{
  font-size:.88rem;
  color:var(--gray-dk);     /* 번역본보다 연한 색 */
  line-height:1.75;
  margin:0;
  font-style:normal;
}
.episode-attr{
  font-family:var(--mono);
  font-size:.68rem;
  color:var(--gray);
  letter-spacing:.12em;
  display:block;
  margin-top:.9rem;
}

/* 벤토 메인 이미지 */
.bento-wrap{position:relative;width:100%;overflow:hidden;margin:2.8rem 0 5rem}
.bento-wrap img{width:100%;height:clamp(260px,42vw,560px);object-fit:cover;object-position:center 38%;display:block}
.bento-wrap .bento-ph{width:100%;height:clamp(260px,42vw,560px);background:#e8e5de;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.8rem;
  letter-spacing:.18em;color:var(--gray)}

/* ── 별빛 오버레이 ── */
.bento-glow-layer{position:absolute;inset:0;pointer-events:none;z-index:2}

/* 중심 글로우 — 별 계란말이 위치 (이미지 우하단 ~72% 68%) */
.bento-glow-layer::before{
  content:"";position:absolute;
  left:70%;top:62%;
  width:clamp(120px,18vw,240px);height:clamp(120px,18vw,240px);
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,
    rgba(255,230,80,.72) 0%,
    rgba(255,200,40,.45) 22%,
    rgba(255,165,0,.18) 48%,
    transparent 72%);
  border-radius:50%;
  animation:glowpulse 2.8s ease-in-out infinite;
}

/* 빛 산란 레이어 — 조금 더 넓고 연하게 */
.bento-glow-layer::after{
  content:"";position:absolute;
  left:70%;top:62%;
  width:clamp(200px,30vw,400px);height:clamp(200px,30vw,400px);
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,
    rgba(255,245,150,.38) 0%,
    rgba(255,220,60,.15) 35%,
    transparent 68%);
  border-radius:50%;
  animation:glowpulse 2.8s ease-in-out infinite .4s;
}

/* 별 모양 광선 (SVG 필터 없이 순수 CSS) */
.bento-star-rays{
  position:absolute;
  left:70%;top:62%;
  width:clamp(80px,12vw,160px);height:clamp(80px,12vw,160px);
  transform:translate(-50%,-50%);
  animation:glowpulse 2.8s ease-in-out infinite .2s, starspin 8s linear infinite;
}
.bento-star-rays::before,.bento-star-rays::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(rgba(255,240,100,.6),transparent),
             linear-gradient(90deg,rgba(255,240,100,.6),transparent),
             linear-gradient(45deg,rgba(255,240,100,.4),transparent),
             linear-gradient(-45deg,rgba(255,240,100,.4),transparent);
  -webkit-mask:
    linear-gradient(#000,#000) center/2px 100% no-repeat,
    linear-gradient(#000,#000) center/100% 2px no-repeat,
    linear-gradient(45deg,#000,#000) center/2px 100% no-repeat,
    linear-gradient(-45deg,#000,#000) center/100% 2px no-repeat;
  mask:
    linear-gradient(#000,#000) center/2px 100% no-repeat,
    linear-gradient(#000,#000) center/100% 2px no-repeat;
  background:linear-gradient(rgba(255,240,120,.0) 0%,rgba(255,240,80,.85) 50%,rgba(255,240,120,.0) 100%);
  filter:blur(1px);
}
.bento-star-rays::before{
  background:linear-gradient(rgba(255,245,100,0) 0%,rgba(255,230,60,.9) 50%,rgba(255,245,100,0) 100%);
  width:2px;left:50%;transform:translateX(-50%);height:100%;
}
.bento-star-rays::after{
  background:linear-gradient(90deg,rgba(255,245,100,0) 0%,rgba(255,230,60,.9) 50%,rgba(255,245,100,0) 100%);
  height:2px;top:50%;transform:translateY(-50%);width:100%;
}

/* 반짝이 파티클 */
.bento-sparkles{position:absolute;left:70%;top:62%;transform:translate(-50%,-50%);pointer-events:none}
.bento-sparkles span{
  position:absolute;width:4px;height:4px;background:#fff;border-radius:50%;
  filter:blur(.5px);
  animation:sparkle 2s ease-in-out infinite;
}
.bento-sparkles span:nth-child(1){left:-28px;top:-24px;animation-delay:0s}
.bento-sparkles span:nth-child(2){left:22px;top:-36px;animation-delay:.4s}
.bento-sparkles span:nth-child(3){left:38px;top:8px;animation-delay:.8s}
.bento-sparkles span:nth-child(4){left:14px;top:30px;animation-delay:.2s}
.bento-sparkles span:nth-child(5){left:-32px;top:18px;animation-delay:.6s}
.bento-sparkles span:nth-child(6){left:-10px;top:38px;animation-delay:1s}
.bento-sparkles span:nth-child(7){left:48px;top:-16px;animation-delay:1.4s}

@keyframes glowpulse{
  0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
}
@keyframes starspin{
  from{transform:translate(-50%,-50%) rotate(0deg)}
  to{transform:translate(-50%,-50%) rotate(360deg)}
}
@keyframes sparkle{
  0%,100%{opacity:0;transform:scale(0)}
  40%,60%{opacity:1;transform:scale(1.6)}
}

/* ─────────────────────────────────────
   INFLUENCER + STATS — 상하 배치
   구조: 텍스트(상) → 폰 sticky 확대 구간 → stats(하)
───────────────────────────────────── */
.influencer-section{
  background:#000;color:var(--rice);
  padding:7rem 0 112px;
}

/* 1단: 헤더 + 텍스트 */
.inf-header{padding:4rem 0 1rem;text-align:center}
.inf-header .eyebrow{justify-content:center;color:rgba(247,246,241,.55)}
.inf-header .eyebrow::before{background:var(--shu)}
.inf-header h2{
  font-family:var(--serif);font-weight:900;
  font-size:clamp(2rem,3.8vw,3.2rem);line-height:1.2;color:var(--rice)
}
.inf-header h2 em{font-style:normal;color:var(--shu)}

.inf-text-block{text-align:center}
.inf-text-block p{
  font-size:clamp(.92rem,1.3vw,1.02rem);color:rgba(247,246,241,.72);
  font-weight:300;line-height:1.9;
  max-width:36em;margin:0 auto 2rem;
}
.inf-quote{
  font-family:var(--serif);font-weight:700;font-size:1rem;line-height:1.75;
  color:rgba(247,246,241,.88);text-align:center;
  border-top:1px solid rgba(247,246,241,.15);
  border-bottom:1px solid rgba(247,246,241,.15);
  padding:.9rem 0;
  max-width:32em;margin:0 auto;
}

/* 2단: sticky 폰 구간
   .inf-sticky-outer — 스크롤 공간 확보 (400vh = 폰 확대 + 머무는 시간)
   .inf-sticky-inner — position:sticky로 화면 중앙에 고정 */
.inf-sticky-outer{
  height:300vh;
  position:relative;
  overflow:visible; /* stats가 outer 하단 밖으로 나가도 보이도록 */
}
.inf-sticky-inner{
  position:sticky;
  top:0px;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  overflow:visible;
  padding:3rem 5vw 0;
  gap:1.2rem;
}
@media(max-width:760px){
  .inf-sticky-inner{
    padding:3rem 0 0;   /* 좌우 패딩 제거 → 완전 중앙 */
    align-items:center;
  }
}

/* 폰 래퍼 — scale 대상 (badge 포함) */
.phone-wrapper{
  display:flex;
  flex-direction:column;
  align-items:stretch;
  width:220px;
  flex-shrink:0;
  align-self:center;
  margin-left:auto;
  margin-right:auto;
  transform-origin:top center;
  will-change:transform;
}
/* 폰 프레임 */
.phone-frame{
  position:relative;
  aspect-ratio:9/16;
  width:100%;
  border-radius:28px;
  overflow:hidden;
  background:#1a1a1a;
  box-shadow:0 40px 80px -20px rgba(0,0,0,.9),
             0 0 0 1px rgba(255,255,255,.07);
  border:6px solid #2a2a2a;
}
.phone-frame video{width:100%;height:100%;object-fit:cover}
.ig-badge{display:none}
/* float-stats 안의 stats-grid 스타일 오버라이드 */
#inf-float-stats .stats-grid{
  border-top:1px solid rgba(247,246,241,.2);
  width:100%;
  max-width:1200px;
  margin:0 auto;
  padding:0 5vw;
  box-sizing:border-box;
}
#inf-float-stats .stat-item{
  padding:1.8rem 2rem;
}

/* 3단: stats — float overlay로 이동됨 */

/* 텍스트 래퍼 — 데스크탑에선 sticky 내부와 동일하게 보이도록 */
.inf-header-wrap{
  display:none; /* 데스크탑: 기존 inf-text-overlay 사용 */
}

@media(max-width:760px){
  /* 텍스트 래퍼: sticky 구간 밖, 정상 플로우 */
  .inf-header-wrap{
    display:block;
    padding:1.5rem 5vw 1.5rem;
    text-align:center;
  }
  /* sticky 내부 텍스트는 모바일에서 숨김 */
  .inf-sticky-inner .inf-text-overlay{
    display:none;
  }
  .inf-sticky-outer{height:280vh}
  .inf-sticky-inner{
    position:sticky;
    top:0;
    width:100%;
    height:100vh;
    padding:0;
    overflow:visible;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  /* 폰: 화면 정중앙에서 100px 위 */
  .phone-wrapper{
    position:relative !important;
    left:auto !important;
    top:auto !important;
    margin:-150px auto 0 !important;
    transform-origin:top center !important;
    align-self:center !important;
    z-index:1;
    width:200px !important;
  }
  .phone-frame{width:200px}
  #inf-float-stats .stats-grid{grid-template-columns:1fr}
  #inf-float-stats .stat-item{padding:1rem 1.4rem;border-right:none;border-bottom:1px solid rgba(247,246,241,.08)}
}

/* 스탯 그리드 — 다크 배경 위 클린 */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(247,246,241,.1)}
.stat-item{padding:2.4rem 1.8rem;border-right:1px solid rgba(247,246,241,.08);position:relative}
.stat-item:last-child{border-right:none}
.stat-item::before{content:"";position:absolute;top:0;left:0;width:0;height:1px;
  background:var(--shu);transition:width .7s ease}
.stat-item.on::before{width:100%}
.stat-icon{width:2rem;height:2rem;margin-bottom:1.2rem;opacity:.5}
.stat-num{font-family:var(--mono);font-weight:500;font-size:clamp(1.6rem,2.8vw,2.4rem);
  color:var(--rice);line-height:1.1;letter-spacing:-.02em;margin-bottom:.5rem}
.stat-label{font-size:.8rem;color:rgba(247,246,241,.55);letter-spacing:.04em;margin-bottom:.25rem}
.stat-sub{font-family:var(--mono);font-size:.68rem;color:var(--shu);letter-spacing:.1em;text-transform:uppercase}

@media(max-width:860px){
  .inf-top{grid-template-columns:1fr}.phone-col{order:-1}.phone-frame{max-width:240px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .stat-item{border-right:none;border-bottom:1px solid rgba(247,246,241,.06)}
}

/* ─────────────────────────────────────
   CONTENT STRATEGY
───────────────────────────────────── */
/* ─────────────────────────────────────
   CONTENT STRATEGY — 2025 Editorial Bento
   트렌드: 비대칭 그리드 + 키네틱 타이포 + 사진 콜라주
───────────────────────────────────── */
.strategy-section{
  background:var(--ink);color:var(--rice);
  padding:7rem 0;overflow:hidden;
  position:relative;
}
.strategy-head{text-align:center;padding:0 5vw;position:relative;z-index:2}
.strategy-head .eyebrow{justify-content:center;color:rgba(247,246,241,.5)}
.strategy-head .eyebrow::before{background:var(--shu)}
.strategy-head h2{
  font-family:var(--serif);font-weight:900;
  font-size:clamp(1.9rem,3.6vw,3rem);
  color:var(--rice);line-height:1.2;margin-bottom:.8rem
}
.strategy-head p{
  font-size:clamp(.92rem,1.3vw,1.02rem);color:rgba(247,246,241,.5);
  font-weight:300;max-width:36em;margin:0 auto 3.5rem;line-height:1.8
}

/* ── 필름 스트립 — seamless 무한 루프 ── */
.film-strip{
  border-top:1px solid rgba(247,246,241,.06);
  border-bottom:1px solid rgba(247,246,241,.06);
  padding:.9rem 0;overflow:hidden;
}
.film-track{display:flex;gap:.6rem;width:max-content;will-change:transform}
.film-track.running{animation:filmroll var(--film-dur,30s) linear infinite}
@keyframes filmroll{from{transform:translateX(0)}to{transform:translateX(var(--film-offset,-50%))}}
.film-item{width:200px;aspect-ratio:1;flex-shrink:0;overflow:hidden;background:#1c1c22;position:relative}
.film-item img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s}
.film-item:hover img{transform:scale(1.08)}
.film-item .fn{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:.68rem;color:rgba(247,246,241,.2);letter-spacing:.14em
}

/* ── 3단 스텝 ── */
.steps-wrap{
  display:grid;grid-template-columns:repeat(3,1fr);gap:0;
  border-top:1px solid rgba(247,246,241,.1);
  max-width:1200px;margin:0 auto;
}
.step-block{
  padding:2.8rem 2.8rem 3rem;
  border-right:1px solid rgba(247,246,241,.06);
  position:relative;overflow:hidden;
  transition:background .3s;
}
.step-block:last-child{border-right:none}
.step-block:hover{background:rgba(247,246,241,.03)}
.step-block::before{
  content:attr(data-num);
  position:absolute;right:1.2rem;top:50%;transform:translateY(-50%);
  font-family:var(--serif);font-weight:900;font-size:6rem;line-height:1;
  color:rgba(247,246,241,.14);
  pointer-events:none;user-select:none;letter-spacing:-.04em;
}
.step-block h3{
  font-family:var(--serif);font-weight:700;font-size:1.08rem;
  color:var(--rice);margin-bottom:.8rem;line-height:1.35;
  word-break:keep-all;overflow-wrap:break-word;
}
.step-block h3::before{
  content:"";display:inline-block;width:.45rem;height:.45rem;
  border-radius:50%;background:var(--shu);
  margin-right:.65rem;vertical-align:.1em;flex-shrink:0;
}
.step-block p{
  font-size:.88rem;color:rgba(247,246,241,.52);font-weight:300;
  line-height:1.75;max-width:26em;word-break:keep-all;overflow-wrap:break-word;
}
.step-bg-num{display:none}
.step-tag{display:none}
@media(max-width:760px){
  .steps-wrap{grid-template-columns:1fr}
  .step-block{border-right:none;border-bottom:1px solid rgba(247,246,241,.06)}
}

/* ── BRAND — 세로 중앙 정렬, 흰 배경 없음 ── */
.brand-section{background:var(--rice);padding:7rem 0;border-top:1px solid var(--line)}
.brand-section .wrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0}
.brand-text-col{margin-bottom:2.8rem}
.brand-text-col .eyebrow{justify-content:center;color:var(--shu)}
.brand-text-col .eyebrow::before{background:var(--shu)}
.brand-title{font-family:var(--serif);font-weight:900;font-size:clamp(2rem,3.8vw,3.2rem);
  color:var(--ink);line-height:1.2;margin:.8rem 0 0}
.brand-logo-col{display:flex;flex-direction:column;align-items:center;gap:1.4rem}
/* 로고 — 배경 없음, 이미지만 */
.brand-logo-frame{background:none;border:none;padding:0;display:flex;align-items:center;justify-content:center}
.brand-logo-frame img{max-width:480px;height:auto;display:block}
.brand-logo-ph{width:280px;height:70px;background:#ece9e2;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:.68rem;color:var(--gray);letter-spacing:.14em}
.brand-caption{font-size:.88rem;color:var(--gray-dk);font-weight:300;
  text-align:center;max-width:30em;line-height:1.8}
@media(max-width:860px){
  .brand-logo-frame img{max-width:320px}
}

/* ─────────────────────────────────────
   PRODUCTS
───────────────────────────────────── */
.products-section{padding:7rem 0;background:var(--rice)}
.products-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;margin-top:2.8rem}
.prod-card{background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;
  overflow:hidden;transition:box-shadow .35s,transform .35s}
.prod-card:hover{box-shadow:0 22px 52px -14px rgba(21,21,26,.15);transform:translateY(-3px)}
.prod-thumb{aspect-ratio:4/5;overflow:hidden;background:#f2f0ec;position:relative;flex-shrink:0}
.prod-thumb img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s}
.prod-card:hover .prod-thumb img{transform:scale(1.06)}
.prod-thumb .img-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:.68rem;color:var(--gray);letter-spacing:.12em;background:#ece9e2;text-align:center;padding:1rem}
.prod-body{padding:1.5rem 1.8rem 1.8rem;flex:1;display:flex;flex-direction:column}
.prod-badge-row{min-height:1.6rem;margin-bottom:.5rem}
.badge{display:inline-block;padding:.24em .85em;font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#fff}
.badge.bestseller{background:var(--shu)}
.badge.new-release{background:#1d4ed8}
.prod-body h3{font-family:var(--serif);font-weight:700;font-size:1.08rem;margin-bottom:.6rem;line-height:1.35;letter-spacing:-.01em}
.prod-desc{font-size:.88rem;color:var(--gray-dk);font-weight:300;line-height:1.7;margin-bottom:.9rem;flex:1}
.prod-features{list-style:none;border-top:1px solid var(--line);padding-top:.85rem;margin-bottom:1.1rem;
  display:flex;flex-direction:column;gap:.32rem}
.prod-features li{font-size:.8rem;color:var(--gray-dk);display:flex;align-items:center;gap:.5rem}
.prod-features li::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--gold);flex-shrink:0}
.buy-stack{display:flex;flex-direction:column;gap:.35rem;margin-top:auto}
.buy-btn{display:flex;align-items:center;justify-content:center;padding:.72em 1em;
  font-size:.74rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;transition:filter .2s}
.buy-btn:hover{filter:brightness(1.1)}
.buy-naver{background:#03C75A;color:#fff}
.buy-amazon{background:#FF9900;color:#111}
.buy-rakuten{background:#BF0000;color:#fff}
.buy-disabled{background:#f0eeea;color:#bbb;cursor:not-allowed;pointer-events:none}
.prod-footnote{font-family:var(--mono);font-size:.68rem;color:var(--gray);margin-top:1.6rem;letter-spacing:.04em}
@media(max-width:900px){.products-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:540px){.products-grid{grid-template-columns:1fr}}

/* ─────────────────────────────────────
   ROADMAP
───────────────────────────────────── */
.roadmap-section{background:var(--ink);color:var(--rice);padding:7rem 0}
.roadmap-section .eyebrow{color:var(--shu)}
.roadmap-section .eyebrow::before{background:var(--shu)}

/* 타임라인 카드 순차 등장 */
.rm-reveal{
  opacity:0;
  transform:translateY(28px);
  transition:opacity .7s ease, transform .7s ease;
}
.rm-reveal.rm-on{
  opacity:1;
  transform:none;
}

/* 타임라인 컨테이너 */
.rm-grid{
  position:relative;
  margin-top:3.5rem;
  padding-bottom:1rem;
}
/* 중앙 세로선 */
.rm-grid::before{
  content:'';
  position:absolute;
  left:50%; top:0; bottom:0;
  width:1px;
  background:linear-gradient(to bottom, transparent, var(--shu) 8%, rgba(247,246,241,.2) 50%, var(--shu) 92%, transparent);
  transform:translateX(-50%);
}

/* 각 카드 */
.rm-card{
  display:flex;
  width:calc(50% - 2.8rem);
  position:relative;
  margin-bottom:3.2rem;
  padding:1.8rem 2rem;
  background:transparent;
  border:none;
  transition:opacity .3s;
}
.rm-card:hover{ opacity:.8; }

/* 홀수 — 왼쪽 */
.rm-card:nth-child(odd){
  margin-left:0;
  margin-right:auto;
  text-align:right;
  flex-direction:column;
  align-items:flex-end;
}
/* 짝수 — 오른쪽 */
.rm-card:nth-child(even){
  margin-left:auto;
  margin-right:0;
  text-align:left;
  flex-direction:column;
  align-items:flex-start;
}

/* 중앙선 위 연결 점 */
.rm-card::before{
  content:'';
  position:absolute;
  top:50%;
  width:10px; height:10px;
  border-radius:50%;
  background:var(--shu);
  border:2px solid var(--ink);
  transform:translateY(-50%);
  z-index:1;
}
.rm-card:nth-child(odd)::before{
  right:-3.35rem; /* 카드 오른쪽 끝 → 중앙선 */
}
.rm-card:nth-child(even)::before{
  left:-3.35rem; /* 카드 왼쪽 끝 → 중앙선 */
}

/* 중앙선 → 카드 연결 수평선 */
.rm-card::after{
  content:'';
  position:absolute;
  top:50%;
  height:1px;
  width:2.4rem;
  background:rgba(247,246,241,.2);
  transform:translateY(-50%);
}
.rm-card:nth-child(odd)::after{ right:-2.85rem; }
.rm-card:nth-child(even)::after{ left:-2.85rem; }

.rm-year{
  font-family:var(--mono);
  font-size:.7rem;
  color:var(--shu);
  letter-spacing:.2em;
  margin-bottom:.7rem;
  display:block;
}
.rm-card h3{
  font-family:var(--serif);
  font-weight:700;
  font-size:1rem;
  line-height:1.35;
  color:var(--rice);
  margin-bottom:.5rem;
}
.rm-card p{
  font-size:.82rem;
  color:rgba(247,246,241,.5);
  line-height:1.65;
  font-weight:300;
}

@media(max-width:700px){
  .rm-grid::before{left:1rem}
  .rm-card{width:calc(100% - 2.8rem);margin-left:2.8rem !important;margin-right:0 !important;text-align:left !important;align-items:flex-start !important}
  .rm-card::before{left:-2rem !important;right:auto !important}
  .rm-card::after{left:-1.55rem !important;right:auto !important;width:1.2rem}
}
.rm-year{font-family:var(--mono);font-size:.68rem;color:var(--shu);letter-spacing:.18em;margin-bottom:.9rem;display:block}
.rm-card h3{font-family:var(--serif);font-weight:700;font-size:.96rem;color:var(--rice);margin-bottom:.55rem;line-height:1.35;word-break:keep-all;overflow-wrap:break-word}
.rm-card p{font-size:.88rem;color:rgba(247,246,241,.45);font-weight:300;line-height:1.7;word-break:keep-all;overflow-wrap:break-word}
@media(max-width:860px){.rm-grid{grid-template-columns:repeat(2,1fr)}.rm-card{border-right:none;border-bottom:1px solid rgba(247,246,241,.08)}}
@media(max-width:500px){.rm-grid{grid-template-columns:1fr}}

/* ── INSTAGRAM FEED ── */
.instagram-section{background:var(--rice);padding:7rem 0;border-top:1px solid var(--line)}
.instagram-section .eyebrow{color:var(--shu)}
.instagram-section .eyebrow::before{background:var(--shu)}
.instagram-section h2{font-family:var(--serif);font-weight:900;
  font-size:clamp(1.9rem,3.4vw,2.8rem);letter-spacing:-.01em;margin-bottom:2.8rem}
.ig-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;align-items:start}

/* embed 래퍼 — 높이를 Instagram이 결정하도록 완전히 풀어줌 */
.ig-embed-wrap{
  background:#f5f4f0;
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  /* embed.js가 높이를 자유롭게 결정하도록 — 일체 강제하지 않음 */
}
/* Instagram blockquote — 일체 CSS 간섭 없음 */
.ig-embed-wrap .instagram-media{
  margin:0 auto!important;
  /* width/height/position — embed.js에 완전 위임 */
}
@keyframes igshimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(max-width:640px){.ig-grid{grid-template-columns:1fr}}
@media(max-width:640px){.ig-grid{grid-template-columns:1fr}}

/* ── CONTACT ── */
.contact-section{background:#000;color:#fff;padding:7rem 0;text-align:center}
.contact-section h2{font-size:clamp(2rem,4.5vw,3.6rem);font-weight:500;letter-spacing:-.03em;

  max-width:34em;margin:0 auto 3.5rem;line-height:1.8}

.contact-card:hover .contact-email{color:var(--gold)}

/* ── FOOTER ── */
footer{background:#000;color:rgba(255,255,255,.38);padding:2.4rem 0;
  border-top:1px solid rgba(255,255,255,.07);font-size:.74rem}
footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem}
.footer-logo{height:2rem;filter:invert(1);opacity:.4;object-fit:contain}
.footer-links{display:flex;gap:1.4rem;flex-wrap:nowrap}

/* ── MODAL ── */
.modal-wrap{display:none;position:fixed;inset:0;z-index:200;
  background:rgba(10,10,12,.75);backdrop-filter:blur(12px);
  align-items:center;justify-content:center;padding:1.5rem}

.modal-box{

}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:.9rem 1.6rem;
  border-bottom:1.5px solid var(--shu);
  flex-shrink:0;background:var(--rice);
}
.modal-head h3{
  font-family:var(--serif);font-weight:700;font-size:.95rem;
  color:var(--ink);letter-spacing:-.01em
}
.modal-close{
  background:none;border:none;font-size:1.4rem;cursor:pointer;
  color:var(--gray);line-height:1;padding:.3rem .5rem;
  transition:color .2s
}
.modal-close:hover{color:var(--shu)}
.modal-body{

.modal-body::-webkit-scrollbar-track{background:transparent}
.modal-body::-webkit-scrollbar-thumb{background:var(--shu);border-radius:99px}
</style>

/* ─────────────────────────────────────────────────────────────
   스크롤 연동 폰 확대 (Unrivaled Reach)
   .inf-sticky-outer 스크롤 진행도(0→1)에 따라 scale(1→2)
   sticky이므로 폰은 화면 중앙에 고정된 채로 커짐
───────────────────────────────────── */
(function(){
  const MIN_SCALE = 1.0;
  const MAX_SCALE = 1.6; /* 최대 80% 크기 */

  

  function updatePhoneScale(){
    const outer   = document.getElementById('inf-sticky-outer');
    const frame   = document.getElementById('phone-wrapper');
    const overlay = document.getElementById('inf-float-overlay');
    const fstats  = document.getElementById('inf-float-stats');
    if(!outer || !frame) return;

    const outerRect  = outer.getBoundingClientRect();
    const vh         = window.innerHeight;
    const scrolled   = -outerRect.top;
    const scrollable = outerRect.height - vh;
    const progress   = Math.min(1, Math.max(0, scrolled / scrollable));
    const scale      = MIN_SCALE + (MAX_SCALE - MIN_SCALE) * progress;

    // 폰 확대
    frame.style.transform = `scale(${scale.toFixed(3)})`;

    // ── badge + stats 위치 계산 ──
    // 폰 wrapper의 실제 화면 좌표 (scale 반영됨)
    const phoneRect   = frame.getBoundingClientRect();
    // scale이 최대(≥1.98)일 때만 표시
    const isMax       = scale >= MAX_SCALE - 0.02;
    // outer를 완전히 지나쳤는지 (더 이상 sticky 없음)
    const pastOuter   = outerRect.bottom < 0;
    // 아직 outer 안에 있는지
    const beforeOuter   = outerRect.top > vh;
    const deepPastOuter = outerRect.bottom < -(vh * 1.2); /* stats 높이만큼 여유 확보 */

    if(isMax && !beforeOuter && !deepPastOuter && overlay){
      const phoneBotFromOuter = phoneRect.bottom - outerRect.top;
      overlay.style.top   = (phoneBotFromOuter + 50) + 'px';
      fstats.style.opacity= '1';

      // padding-bottom 1회 확정
      if(!overlay._padSet){
        overlay._padSet = true;
        requestAnimationFrame(() => {
          const overlayTopPx = parseFloat(overlay.style.top) || 0;
          const overlayH     = overlay.offsetHeight;
          const outerH       = outer.offsetHeight;
          const overflow     = (overlayTopPx + overlayH) - outerH;
          const needed       = Math.max(0, overflow) + 112;
          const sec = document.getElementById('influencer');
          if(sec) sec.style.paddingBottom = needed + 'px';
        });
      }
    } else {
      if(fstats) fstats.style.opacity = '0';
      if(deepPastOuter || beforeOuter){
        if(overlay) overlay._padSet = false;
      }
    }
  }

  let ticking = false;
  window.addEventListener('scroll', () => {
    if(!ticking){
      requestAnimationFrame(() => { updatePhoneScale(); ticking = false; });
      ticking = true;
    }
  }, {passive:true});
  updatePhoneScale();
})();

const SONA_POOL = [

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* 히어로 + Unrivaled Reach 영상 한 번에 결정 */
function resolveAllVideos() {
  // ① 히어로용: SONA 1개 + NORMAL 2개
  const sonaPick = shuffle([...SONA_POOL])[0];
  const normalShuffled = shuffle([...NORMAL_POOL]);
  const n1 = normalShuffled[0];
  const n2 = normalShuffled[1];

  // ② 히어로 3패널 배열 (sona 위치 랜덤)
  const sonaIdx = Math.floor(Math.random() * 3);
  const heroPicks = [];
  let ni = 0;
  for (let i = 0; i < 3; i++) {
    heroPicks.push(i === sonaIdx ? sonaPick : [n1, n2][ni++]);
  }

  // ③ Unrivaled Reach: 히어로에서 사용되지 않은 영상 중 1개
  const heroSet = new Set(heroPicks);
  const remaining = shuffle([...SONA_POOL, ...NORMAL_POOL].filter(v => !heroSet.has(v)));
  const phonePick = remaining[0] || sonaPick;

  return { heroPicks, phonePick };
}

function initHero() {
  const { heroPicks: picked, phonePick } = resolveAllVideos();

  // Unrivaled Reach 폰 영상 세팅
  const phoneVid = document.getElementById('inf-phone-video');
  if (phoneVid) { phoneVid.src = phonePick; phoneVid.load(); }

  /* PC 3분할 */
  const triptych = document.getElementById('triptych');
  picked.forEach((src, i) => {
    const panel = document.createElement('div');
    panel.className = 'panel';
    const vid = document.createElement('video');
    vid.src = src; vid.autoplay = true; vid.muted = true;
    vid.loop = true; vid.setAttribute('playsinline','');
    const lbl = document.createElement('span');
    lbl.className = 'p-label'; lbl.textContent = `Reel 0${i+1}`;
    panel.appendChild(vid); panel.appendChild(lbl);
    triptych.appendChild(panel);
  });

  /* 모바일 캐러셀 */
  const DUR = 5000;
  const track    = document.getElementById('ctrack');
  const bar      = document.getElementById('cbar');
  const dotsWrap = document.getElementById('cdots');

  picked.forEach((src, i) => {
    const slide = document.createElement('div');
    slide.className = 'c-slide';
    const vid = document.createElement('video');
    vid.src = src; vid.muted = true; vid.loop = true; vid.setAttribute('playsinline','');
    slide.appendChild(vid);
    track.appendChild(slide);

    const dot = document.createElement('button');
    dot.className = 'c-dot' + (i===0?' on':'');
    dot.dataset.i = i;
    dotsWrap.appendChild(dot);
  });

  const slides = track.querySelectorAll('.c-slide');
  const cvids  = track.querySelectorAll('video');
  const dots   = dotsWrap.querySelectorAll('.c-dot');
  let cur = 0, ctimer, isMob = false;

  function goTo(idx) {
    cur = (idx + slides.length) % slides.length;
    track.style.transform = `translateX(-${cur * 33.333}%)`;
    dots.forEach((d,j) => d.classList.toggle('on', j===cur));
    cvids.forEach((v,j) => { j===cur ? v.play() : (v.pause(), v.currentTime=0); });
    bar.style.transition='none'; bar.style.width='0'; bar.offsetWidth;
    bar.style.transition=`width ${DUR}ms linear`; bar.style.width='100%';
  }
  function autoNext() { clearTimeout(ctimer); ctimer=setTimeout(()=>{goTo(cur+1);autoNext();}, DUR); }
  function initMob()  { if(!isMob){ isMob=true; goTo(0); autoNext(); } }

  dots.forEach(d => d.addEventListener('click', () => { clearTimeout(ctimer); goTo(+d.dataset.i); autoNext(); }));
  let tx=0, ty=0, locked=false;
  const carousel=document.getElementById('carousel');
  carousel.addEventListener('touchstart', e=>{
    tx=e.touches[0].clientX;
    ty=e.touches[0].clientY;
    locked=false;
  },{passive:true});
  carousel.addEventListener('touchmove', e=>{
    const dx=Math.abs(e.touches[0].clientX-tx);
    const dy=Math.abs(e.touches[0].clientY-ty);
    if(!locked){
      // 첫 움직임이 가로가 더 크면 좌우 스와이프로 판별 → 세로 스크롤 막기
      if(dx>dy && dx>8){ locked=true; }
    }
    if(locked) e.preventDefault();
  },{passive:false});
  carousel.addEventListener('touchend', e=>{
    const dx=e.changedTouches[0].clientX-tx;
    if(Math.abs(dx)>40){clearTimeout(ctimer);goTo(cur+(dx<0?1:-1));autoNext();}
  },{passive:true});

  function checkMob(){
    if(window.innerWidth<=760) initMob();
    else { isMob=false; clearTimeout(ctimer); cvids.forEach(v=>v.pause()); }
  }
  window.addEventListener('resize',()=>setTimeout(checkMob,180));
  checkMob();
}

let lang = 'ko';

function setLang(l) {
  lang = l;
  document.documentElement.lang = l === 'ko' ? 'ko' : l === 'ja' ? 'ja' : 'en';
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.textContent===l));
  document.getElementById('nav-cta-btn').textContent = T[l].nav.cta;
  render();
}

function buyBtns(urls, l) {
  const naverLabel = (T[l]?.ui?.naverBtn) || 'Naver Smart Store';
  if(l==='ko') return urls.naver
    ? `<a class="buy-btn buy-naver" href="${urls.naver}" target="_blank" rel="noopener">${naverLabel}</a>`
    : `<div class="buy-btn buy-disabled">${naverLabel}</div>`;
  if(l==='ja'){
    let h='';
    h += urls.amazon  ? `<a class="buy-btn buy-amazon"  href="${urls.amazon}"  target="_blank" rel="noopener">Amazon JP</a>`  : `<div class="buy-btn buy-disabled">Amazon JP</div>`;
    h += urls.rakuten ? `<a class="buy-btn buy-rakuten" href="${urls.rakuten}" target="_blank" rel="noopener">楽天市場</a>` : `<div class="buy-btn buy-disabled">楽天市場</div>`;
    return h;
  }
  return urls.amazon
    ? `<a class="buy-btn buy-amazon" href="${urls.amazon}" target="_blank" rel="noopener">Amazon US</a>`
    : `<div class="buy-btn buy-disabled">Amazon US</div>`;
}

function maskName(name) {
  if (!name || name.length === 0) return '*';
  // 앞 1글자만 표시, 나머지는 실제 글자 수만큼 * 마스킹
  const visible = name.slice(0, 1);
  const masked  = '*'.repeat(Math.max(name.length - 1, 1));
  return visible + masked;
}

function renderReview(lang) {
  const wrap = document.getElementById('episode-wrap');
  if (!wrap) return;
  const r = AMAZON_REVIEWS[Math.floor(Math.random() * AMAZON_REVIEWS.length)];
  const maskedName = maskName(r.nameRaw);
  const stars = '★★★★★';
  let content = '';
  if (lang === 'ko') {
    content = '<div class="review-stars">' + stars + '</div>'
      + '<p class="episode-text">' + r.textKo + '</p>'
      + '<div class="review-original"><span class="review-original-label">' + (T[lang]?.ui?.reviewOriginalLabel || '원문') + '</span>'
      + '<p class="review-original-text">' + r.textJa + '</p></div>'
      + '<span class="episode-attr">— ' + maskedName + ' / Amazon JP · ' + r.dateJa + '</span>';
  } else if (lang === 'ja') {
    content = '<div class="review-stars">' + stars + '</div>'
      + '<p class="episode-text">' + r.textJa + '</p>'
      + '<span class="episode-attr">— ' + maskedName + ' / Amazon JP · ' + r.dateJa + '</span>';
  } else {
    // en: textEn(영어 번역) 표시, 원문(일본어) 함께 표시
    content = '<div class="review-stars">' + stars + '</div>'
      + '<p class="episode-text">' + (r.textEn || r.textKo) + '</p>'
      + '<div class="review-original"><span class="review-original-label">' + (T[lang]?.ui?.reviewOriginalLabel || 'Original (Japanese)') + '</span>'
      + '<p class="review-original-text">' + r.textJa + '</p></div>'
      + '<span class="episode-attr">— ' + maskedName + ' / Amazon JP · ' + r.dateJa + '</span>';
  }
  wrap.innerHTML = content;
}

  const sep = '<i>·</i>';

const FOLLOWERS_FALLBACK = { ko: '14.8만', ja: '14.8万人', en: '148K' };
(function sanitizeFollowerMarkers(){
  ['ko','ja','en'].forEach(lg => {
    const marker = '__FOLLOWERS_' + lg.toUpperCase() + '__';

/* ── 모달 ── */
const MODAL_FILES = {privacy:'./privacy.html', terms:'./terms.html', notices:'./legal.html'};
function openModal(type) {
  document.getElementById('modal-title').textContent = T[lang].legal[type];
  // 모달 먼저 열기
  document.getElementById('modal').classList.add('open');
  document.getElementById('modal-body').innerHTML =
    '<p style="text-align:center;padding:3rem;color:#999;font-family:var(--mono);font-size:.74rem;letter-spacing:.1em">LOADING...</p>';

  fetch(MODAL_FILES[type], {cache:'no-cache'})
    .then(r => {
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.text();
    })
    .then(raw => {
      const doc = new DOMParser().parseFromString(raw,'text/html');
      // 현재 언어 섹션 → ja fallback → 전체
      const sec = doc.getElementById(lang)
               || doc.getElementById('ja')
               || doc.querySelector('section')
               || doc.body;
      document.getElementById('modal-body').innerHTML =
        sec ? (sec.tagName === 'BODY' ? sec.innerHTML : sec.outerHTML) : raw;
    })
    .catch(err => {
      console.warn('[Modal]', type, err.message);
      const errMsg = (T[lang]?.ui?.modalError) || 'Unable to load file.';
      document.getElementById('modal-body').innerHTML =
        '<p style="text-align:center;padding:4rem;color:#999;font-family:var(--mono);font-size:.74rem">'+
        errMsg+'</p>';
    });
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }

/* ── 이미지 fallback ── */
function handleImgError(img) {
  img.style.display = 'none';
  if(img.id === 'nav-logo-img'){
    img.parentNode.insertAdjacentHTML('beforeend',
      '<span style="font-family:serif;font-weight:900;font-size:1.2rem;letter-spacing:.05em">Kray, Inc.</span>');
    return;
  }
  if(img.id === 'brand-logo-img'){
    img.insertAdjacentHTML('afterend','<div class="brand-logo-ph">sonaandtokyo-logo.png</div>');
    return;
  }
  const ph = img.getAttribute('data-ph');
  if(ph) img.insertAdjacentHTML('afterend', `<div class="img-ph">${ph}</div>`);
}
document.addEventListener('error', e => { if(e.target.tagName==='IMG') handleImgError(e.target); }, true);
