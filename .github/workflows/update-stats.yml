name: Update Instagram Follower Count

on:
  schedule:
    - cron: '0 0 * * *'   # 매일 JST 09:00
  workflow_dispatch:

jobs:
  update-followers:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run follower update script
        run: python update_stats.py
        continue-on-error: true

      - name: Upload screenshot for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-screenshot
          path: debug_instagram.png
          if-no-files-found: ignore

      - name: Check for changes
        id: changes
        run: git diff --quiet index.html || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: update Instagram follower count [skip ci]"
          git push
