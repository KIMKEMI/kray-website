name: Update Instagram Follower Count

on:
  schedule:
    # 매일 JST 04:00 (UTC 19:00) 실행
    - cron: '0 19 * * *'
  workflow_dispatch:   # 수동 실행 가능

jobs:
  update-followers:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run follower update script
        run: python update_stats.py
        # 수집 실패해도 워크플로우가 빨간불 되지 않도록
        continue-on-error: true

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet index.html || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: update Instagram follower count [skip ci]"
          git push
